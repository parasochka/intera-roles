name: Validate theme

# Sanity-checks the theme on every push so WP Pusher never pulls a broken build.
# Classic PHP theme in theme/: lint every PHP file, confirm the required theme
# files exist, and confirm the design-system manifest and tokens are present.
# No secrets, no server access — deploy happens in WordPress via WP Pusher.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l
          echo "All PHP files parse."

      - name: Check the CSS minifier
        run: php bin/test-css-minify.php

      - name: Ensure required theme files exist
        run: |
          set -e
          for f in style.css functions.php index.php header.php footer.php \
                   page.php single.php 404.php \
                   inc/setup.php inc/enqueue.php; do
            if [ ! -f "theme/$f" ]; then
              echo "::error title=Missing theme file::theme/$f is required for this classic theme"
              exit 1
            fi
          done
          echo "All required theme files present."

      - name: Ensure the design system is present and wired
        run: |
          set -e
          DS="theme/_ds/intera"
          if [ ! -f "$DS/styles.css" ]; then
            echo "::error title=Missing manifest::$DS/styles.css is required"
            exit 1
          fi
          # Every sheet the manifest @imports must exist on disk.
          missing=0
          while read -r rel; do
            [ -z "$rel" ] && continue
            path="$DS/${rel#./}"
            if [ ! -f "$path" ]; then
              echo "::error title=Missing design token::$path is @imported by $DS/styles.css but does not exist"
              missing=1
            fi
          done < <(grep -oE '@import[[:space:]]+(url\()?["'"'"'][^"'"'"']+' "$DS/styles.css" | sed -E 's/.*["'"'"']//')
          [ "$missing" -eq 0 ] || exit 1
          echo "Design system present and every @import resolves."

      - name: Refuse a renamed meta capability
        run: |
          set -e
          # register_post_type() copies a renamed `edit_post`, `read_post` or
          # `delete_post` into the global $post_type_meta_caps map, and
          # map_meta_cap() then treats the *target* name as a meta capability
          # site-wide. Pointing one at a primitive cap such as manage_options
          # makes every current_user_can() for it fail, for administrators too,
          # and takes half of wp-admin down with it. This shipped once already.
          if grep -rnE "'(edit_post|read_post|delete_post)'[[:space:]]*=>" theme --include='*.php' \
               | grep -vE "=>[[:space:]]*'(edit_post|read_post|delete_post)'" >/dev/null 2>&1; then
            echo "::error title=Renamed meta capability::A post type renames edit_post, read_post or delete_post. That poisons \$post_type_meta_caps and breaks the target capability site-wide — rename only the primitive capabilities."
            grep -rnE "'(edit_post|read_post|delete_post)'[[:space:]]*=>" theme --include='*.php' \
              | grep -vE "=>[[:space:]]*'(edit_post|read_post|delete_post)'" || true
            exit 1
          fi
          echo "No meta capability is renamed."

      - name: Refuse an unguarded require of a theme file
        run: |
          set -e
          # A WP Pusher update replaces the theme directory in place, and one
          # that stops half way leaves the theme missing files. An unguarded
          # `require` of one of them is a fatal error on *every* request —
          # front end, wp-admin and REST together — so the dashboard you would
          # redeploy from is down too. That is how the site went down on
          # 2026-08-24: `inc/setup.php` required a template part that the
          # deploy had not written. Guard the require and a half-finished
          # deploy costs a feature instead of the site.
          offenders=$(awk '
            FNR == 1 { ctx1 = ctx2 = ctx3 = "" }
            {
              if ($0 ~ /^[[:space:]]*(require|include)(_once)?([[:space:]]|\()/) {
                if (ctx1 !~ /file_exists|is_readable/ && ctx2 !~ /file_exists|is_readable/ && ctx3 !~ /file_exists|is_readable/) {
                  printf "%s:%d:%s\n", FILENAME, FNR, $0
                }
              }
              ctx3 = ctx2; ctx2 = ctx1; ctx1 = $0
            }' $(find theme -name '*.php'))
          if [ -n "$offenders" ]; then
            echo "::error title=Unguarded require::A require/include of a theme file is not guarded by file_exists() or is_readable(). A partial deploy then fatals every request, wp-admin included."
            echo "$offenders"
            exit 1
          fi
          echo "Every require in the theme is guarded."

      - name: Warn on hard-coded colors outside the design system
        continue-on-error: true
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,8}\b' theme --include='*.php' --include='assets/css/*.css' >/dev/null 2>&1; then
            echo "::warning title=Raw hex found::Colors belong in theme/_ds/intera/tokens/*.css — reference them with var(--…)"
            grep -rnE '#[0-9a-fA-F]{3,8}\b' theme --include='*.php' || true
          else
            echo "No raw hex outside the design system."
          fi
